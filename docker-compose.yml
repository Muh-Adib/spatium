# UNIMASI Studio — Coolify-ready Docker Compose
#
# Coolify schema notes (verified against coolify.io/docs, 2026-11-02):
#  - `${VAR:?}` blocks deploy when unset; `${VAR:-default}` provides a safe default.
#  - SERVICE_FQDN_<SERVICE>_<PORT> assigns the public domain via Coolify's proxy.
#  - No `ports:` for public services — Coolify's reverse proxy handles routing.
#  - One-shot services use `restart: "no"` + `exclude_from_hc: true`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uni}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?POSTGRES password is required}
      POSTGRES_DB: ${POSTGRES_DB:-uni}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uni} -d ${POSTGRES_DB:-uni}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    exclude_from_hc: true
    command: ["npx", "--yes", "prisma", "db", "update"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-uni}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-uni}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://unimasi.id}
        NEXT_PUBLIC_CORE_URL: ${NEXT_PUBLIC_CORE_URL:-}
        NEXT_PUBLIC_CORE_SITE_KEY: ${NEXT_PUBLIC_CORE_SITE_KEY:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3001"
      SERVICE_FQDN_APP_3001: ${SERVICE_FQDN_APP_3001:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-uni}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-uni}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://unimasi.id}
      AUTH_SECRET: ${SERVICE_HEX_32_AUTHSECRET:?AUTH_SECRET is required}
      NEXTAUTH_SECRET: ${SERVICE_HEX_32_AUTHSECRET}
      REQUIRE_STRONG_AUTH_SECRET: ${REQUIRE_STRONG_AUTH_SECRET:-true}
      API_BEARER_TOKEN: ${SERVICE_HEX_32_APIBEARER:?API_BEARER_TOKEN is required}
      SITE_API_KEY: ${SERVICE_HEX_32_SITEAPIKEY:?SITE_API_KEY is required}
      REVALIDATE_SECRET: ${SERVICE_HEX_32_REVALIDATE:?REVALIDATE_SECRET is required}
      WEBHOOK_SECRET: ${SERVICE_HEX_32_WEBHOOK:?WEBHOOK_SECRET is required}
      NEXT_PUBLIC_CORE_URL: ${NEXT_PUBLIC_CORE_URL:-}
      NEXT_PUBLIC_CORE_SITE_KEY: ${NEXT_PUBLIC_CORE_SITE_KEY:-}
      CORE_API_URL: ${CORE_API_URL:-}
      CORE_SITE_KEY: ${CORE_SITE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GSC_CLIENT_EMAIL: ${GSC_CLIENT_EMAIL:-}
      GSC_PRIVATE_KEY: ${GSC_PRIVATE_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
  uploads_data:
