# UNIMASI Studio — Coolify Self-Contained Docker Compose (App + Embedded PostgreSQL)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uni}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:-uni_secure_db_pwd_2026}}
      POSTGRES_DB: ${POSTGRES_DB:-uni}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uni} -d ${POSTGRES_DB:-uni}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - coolify

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://unimasi.udp.co.id}
        NEXT_PUBLIC_CORE_URL: ${NEXT_PUBLIC_CORE_URL:-}
        NEXT_PUBLIC_CORE_SITE_KEY: ${NEXT_PUBLIC_CORE_SITE_KEY:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      SERVICE_FQDN_APP_3000: ${SERVICE_FQDN_APP_3000:-}
      SERVICE_FQDN_APP: ${SERVICE_FQDN_APP:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-uni}:${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:-uni_secure_db_pwd_2026}}@postgres:5432/${POSTGRES_DB:-uni}?schema=public}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://unimasi.udp.co.id}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-UNIMASI Studio}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET}}
      REQUIRE_STRONG_AUTH_SECRET: ${REQUIRE_STRONG_AUTH_SECRET:-false}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      SITE_API_KEY: ${SITE_API_KEY:-site_sec_unimasi}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      NEXT_PUBLIC_CORE_URL: ${NEXT_PUBLIC_CORE_URL:-https://unimasi.udp.co.id}
      NEXT_PUBLIC_CORE_SITE_KEY: ${NEXT_PUBLIC_CORE_SITE_KEY:-site_sec_unimasi}
      CORE_API_URL: ${CORE_API_URL:-http://127.0.0.1:3000}
      CORE_SITE_KEY: ${CORE_SITE_KEY:-site_sec_unimasi}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GSC_CLIENT_EMAIL: ${GSC_CLIENT_EMAIL:-}
      GSC_PRIVATE_KEY: ${GSC_PRIVATE_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-AIzaSyCBxSd8ShSPchfDDvpZsW4gv1bJXpdvgUg}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@unimasi.id}
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
      # Cloudflare R2 Storage (Coolify S3 Storage)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-346db5659201a0a49280a31d2078da0e}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-78b6a46299d1db275b1d7344ebb229cb}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-43f12398accd671b3e06a21ce63b54bcd0c8cdcb4d5c4afc27625f368f0262ef}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-udp}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://pub-e7d6fa66f91d440ba64c18f3a3f01ee3.r2.dev}
      R2_ENDPOINT: ${R2_ENDPOINT:-https://346db5659201a0a49280a31d2078da0e.r2.cloudflarestorage.com}
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - coolify

volumes:
  postgres_data:
  uploads_data:

networks:
  coolify:
    external: true
