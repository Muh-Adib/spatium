# UNIMASI Studio — Coolify Docker Compose deployment (port 3000, secure network)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://unimasi.udp.co.id}
        NEXT_PUBLIC_CORE_URL: ${NEXT_PUBLIC_CORE_URL:-}
        NEXT_PUBLIC_CORE_SITE_KEY: ${NEXT_PUBLIC_CORE_SITE_KEY:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      SERVICE_FQDN_APP_3000: ${SERVICE_FQDN_APP_3000:-}
      SERVICE_FQDN_APP: ${SERVICE_FQDN_APP:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-uni}:${SERVICE_PASSWORD_POSTGRES:-uni_pwd_7a9c1e04db3f6281e05a}@4inpryjbkmkgmerar4erunzl:5432/${POSTGRES_DB:-uni}?schema=public}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://unimasi.udp.co.id}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET}}
      REQUIRE_STRONG_AUTH_SECRET: ${REQUIRE_STRONG_AUTH_SECRET:-false}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      SITE_API_KEY: ${SITE_API_KEY:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      NEXT_PUBLIC_CORE_URL: ${NEXT_PUBLIC_CORE_URL:-}
      NEXT_PUBLIC_CORE_SITE_KEY: ${NEXT_PUBLIC_CORE_SITE_KEY:-}
      CORE_API_URL: ${CORE_API_URL:-}
      CORE_SITE_KEY: ${CORE_SITE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GSC_CLIENT_EMAIL: ${GSC_CLIENT_EMAIL:-}
      GSC_PRIVATE_KEY: ${GSC_PRIVATE_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
      # Cloudflare R2 Storage (Coolify S3 Storage)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-346db5659201a0a49280a31d2078da0e}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-udp}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-https://346db5659201a0a49280a31d2078da0e.r2.cloudflarestorage.com}
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - coolify

volumes:
  uploads_data:

networks:
  coolify:
    external: true
